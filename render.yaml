services:
  - type: web
    name: yacht-platform-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt ; pip install "curl-cffi>=0.7.0" --prefer-binary || true ; python -m playwright install chromium-headless-shell || true
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: SCRAPER_PROXY_URL
        sync: false
      # Marketing agent (see DEPLOYMENT.md, "Marketing Agent"); the three secrets match the agent's values.
      - key: MARKETING_AGENT_URL
        sync: false
      - key: MARKETING_AGENT_API_KEY
        sync: false
      - key: MARKETING_FEED_KEY
        sync: false
      - key: MARKETING_WEBHOOK_URL
        sync: false
      - key: MARKETING_WEBHOOK_SECRET
        sync: false
      - key: MARKETING_BLOG_AUTHOR_ID
        sync: false
